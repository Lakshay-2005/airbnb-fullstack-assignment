[tool.ruff]
line-length = 110
exclude = [".venv"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"app/seed_data.py" = ["E501"]
"app/seed.py" = ["E501"]
"app/seed_extra.py" = ["E501"]
"tests/*" = ["E501"]
